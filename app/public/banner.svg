<!-- app/public/banner.svg v1.14.37 — Agent Skills Hub README 横幅（品牌主绿渐变 + 复用 logo Hub 图形 + 项目名/副标题） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="ash-title ash-desc" lang="zh-CN">
  <title id="ash-title">Agent Skills Hub</title>
  <desc id="ash-desc">高质量 AI 技能目录：按分类浏览、搜索、即取即用。开源免费。</desc>
  <defs>
    <linearGradient id="ash-banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e9e6b"/>
      <stop offset="1" stop-color="#5cc98c"/>
    </linearGradient>
    <linearGradient id="ash-banner-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e9e6b"/>
      <stop offset="1" stop-color="#5cc98c"/>
    </linearGradient>
  <symbol id="ash-hub" viewBox="0 0 32 32">
    <g fill="#ffffff" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round">
      <line x1="16" y1="16" x2="16" y2="7.5" opacity=".55"/>
      <line x1="16" y1="16" x2="24.5" y2="21" opacity=".55"/>
      <line x1="16" y1="16" x2="7.5" y2="21" opacity=".55"/>
      <circle cx="16" cy="16" r="3.4" fill="#ffffff" stroke="none"/>
      <circle cx="16" cy="7.5" r="2.3" stroke="none"/>
      <circle cx="24.5" cy="21" r="2.3" stroke="none"/>
      <circle cx="7.5" cy="21" r="2.3" stroke="none"/>
    </g>
  </symbol>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="400" fill="url(#ash-banner-bg)"/>

  <!-- 装饰：右下/右上淡色大圆，增强层次（纯白低透明度，浅底场景仍可用） -->
  <circle cx="1080" cy="360" r="180" fill="#ffffff" opacity="0.08"/>
  <circle cx="1160" cy="80" r="120" fill="#ffffff" opacity="0.06"/>

  <!-- 左侧品牌标志：白色半透明台 + 主绿圆角方 + 复用 Hub symbol -->
  <g transform="translate(150 130)">
    <rect width="140" height="140" rx="32" fill="#ffffff" opacity="0.12"/>
    <rect x="20" y="20" width="100" height="100" rx="22" fill="url(#ash-banner-logo)"/>
    <use href="#ash-hub" x="20" y="20" width="100" height="100"/>
  </g>

  <!-- 右侧文案：无衬线品牌字体栈，统一调性 -->
  <text x="360" y="190" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="68" font-weight="700" fill="#ffffff">Agent Skills Hub</text>
  <text x="362" y="250" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" fill="#eafff2">高质量 AI 技能目录 · 按分类浏览、搜索、即取即用</text>
  <text x="362" y="300" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#d6f5e2" opacity="0.92">Open-source &amp; free curated agent skills</text>
</svg>
