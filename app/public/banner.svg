<!-- app/public/banner.svg v1.14.69 — Agent Skills Hub README 横幅 (3:1)（衬线主标题 + 复用 brand/hub.svg + 波纹 + 无障碍） -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" role="img" aria-labelledby="ash-title ash-desc" lang="zh-CN" focusable="false">
  <title id="ash-title">Agent Skills Hub</title>
  <desc id="ash-desc">高质量 AI 技能目录：按分类浏览、搜索、即取即用。开源免费。</desc>
  <defs>
    <linearGradient id="ash-banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e9e6b"/>
      <stop offset="1" stop-color="#5cc98c"/>
    </linearGradient>
    <linearGradient id="ash-banner-logo" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e9e6b"/>
      <stop offset="1" stop-color="#5cc98c"/>
    </linearGradient>
    
  <filter id="ash-text-edge" x="-20%" y="-20%" width="140%" height="140%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="d"/>
    <feFlood flood-color="#10231a" flood-opacity="0.55"/>
    <feComposite in2="d" operator="in" result="stroke"/>
    <feMerge>
      <feMergeNode in="stroke"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
    
    <symbol id="ash-hub" viewBox="0 0 32 32">
      <g fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <line x1="16" y1="16" x2="16" y2="7.5" opacity=".55"/>
        <line x1="16" y1="16" x2="24.5" y2="21" opacity=".55"/>
        <line x1="16" y1="16" x2="7.5" y2="21" opacity=".55"/>
        <circle cx="16" cy="16" r="3.4" fill="currentColor" stroke="none"/>
        <circle cx="16" cy="7.5" r="2.3" stroke="none"/>
        <circle cx="24.5" cy="21" r="2.3" stroke="none"/>
        <circle cx="7.5" cy="21" r="2.3" stroke="none"/>
      </g>
    </symbol>
  </defs>

  <!-- 背景（135° 对角渐变） -->
  <rect width="1200" height="400" fill="url(#ash-banner-bg)"/>

  <!-- 装饰：品牌波纹点阵，呼应「技能汇聚」语义 -->
  
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10">
    <circle cx="1140" cy="372" r="60"/>
    <circle cx="1140" cy="372" r="110"/>
    <circle cx="1140" cy="372" r="165"/>
    <circle cx="1140" cy="372" r="225"/>
  </g>
  <circle cx="1168" cy="64" r="90" fill="#ffffff" opacity="0.06"/>

  <!-- 左侧品牌标志：白色半透明台 + 主绿圆角方 + 复用 Hub symbol（currentColor=白） -->
  <g transform="translate(150 130)">
    <rect width="160" height="160" rx="36.800000000000004" fill="#ffffff" opacity="0.12"/>
    <rect x="22.400000000000002" y="22.400000000000002" width="115.19999999999999" height="115.19999999999999" rx="25.6" fill="url(#ash-banner-logo)"/>
    <use href="#ash-hub" xlink:href="#ash-hub" x="22.400000000000002" y="22.400000000000002" width="115.19999999999999" height="115.19999999999999" color="#ffffff"/>
  </g>

  <!-- 右侧文案：主标题衬线体，描边保证 WCAG AA -->
  <text x="360" y="200" font-family="Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif" font-size="76" font-weight="700" fill="#ffffff" filter="url(#ash-text-edge)">Agent Skills Hub</text>
  <text x="362" y="258" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" fill="#eafff2" filter="url(#ash-text-edge)">高质量 AI 技能目录 · 按分类浏览、搜索、即取即用</text>
  <text x="362" y="308" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#d6f5e2" opacity="0.92">Curated, open-source agent skills — free to use</text>
  <g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#ffffff">
    <text x="362" y="356" font-size="21" font-weight="700">48 Skills · 5 Domains · Offline-ready</text>
  </g>
</svg>
