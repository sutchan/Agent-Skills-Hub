<!-- app/public/banner.svg v1.14.36 — Agent Skills Hub README 横幅（品牌主绿，复用 logo 图形） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Agent Skills Hub Banner">
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e9e6b"/>
      <stop offset="1" stop-color="#5cc98c"/>
    </linearGradient>
    <linearGradient id="banner-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e9e6b"/>
      <stop offset="1" stop-color="#5cc98c"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="400" fill="url(#banner-bg)"/>

  <!-- 装饰：右下淡色大圆，增强层次 -->
  <circle cx="1080" cy="360" r="180" fill="#ffffff" opacity="0.08"/>
  <circle cx="1160" cy="80" r="120" fill="#ffffff" opacity="0.06"/>

  <!-- 左侧品牌标志（放大的三节点 Hub） -->
  <g transform="translate(150 130)">
    <rect width="140" height="140" rx="32" fill="#ffffff" opacity="0.12"/>
    <rect x="20" y="20" width="100" height="100" rx="22" fill="url(#banner-logo)"/>
    <g fill="#ffffff" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round">
      <line x1="70" y1="70" x2="70" y2="38" opacity=".55"/>
      <line x1="70" y1="70" x2="104" y2="92" opacity=".55"/>
      <line x1="70" y1="70" x2="36" y2="92" opacity=".55"/>
      <circle cx="70" cy="70" r="11" fill="#ffffff" stroke="none"/>
      <circle cx="70" cy="38" r="7.4" stroke="none"/>
      <circle cx="104" cy="92" r="7.4" stroke="none"/>
      <circle cx="36" cy="92" r="7.4" stroke="none"/>
    </g>
  </g>

  <!-- 右侧文案 -->
  <text x="360" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#ffffff">Agent Skills Hub</text>
  <text x="362" y="250" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" fill="#eafff2">高质量 AI 技能目录 · 按分类浏览、搜索、即取即用</text>
  <text x="362" y="300" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#d6f5e2" opacity="0.92">200+ curated agent skills — open source &amp; free</text>
</svg>
