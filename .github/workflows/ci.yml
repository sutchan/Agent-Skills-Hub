# CI —— 校验 / 测试 / 构建门禁
#
# 架构说明（基于仓库实际结构）：
#   - 单一 Next.js 14（App Router）应用，源码在 app/，配置与依赖在仓库根
#   - 包管理器：pnpm@9.15.0（仓库仅有 pnpm-lock.yaml，无 package-lock.json）
#   - .npmrc 开启 engine-strict / package-manager-strict，必须用 pnpm 安装
#   - 构建流水线：build-skills-data → build.mjs → sync-tokens → sync-css → next build
#   - next.config.mjs 使用 output: "standalone"
#
# 门禁分级：
#   硬门禁（失败即阻断）：类型检查、单元测试、生产构建
#   观察期（仅报告不阻断）：技能元数据校验、生成物一致性校验
#     原因见各 job 内注释，修复后请移除 continue-on-error 恢复为硬门禁。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支新提交自动取消旧的进行中任务，节省 runner 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 .nvmrc（22）及 package.json engines（22.x || 26.x）对齐
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: 质量门禁（类型检查 + 单元测试）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        # 必须用 pnpm：仓库只提供 pnpm-lock.yaml，npm ci 会因缺少 package-lock.json 直接失败
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 单元测试（tools/lib）
        run: pnpm test

  validate-skills:
    name: 技能元数据校验（硬门禁）
    runs-on: ubuntu-latest
    # 硬门禁说明：
    #   自 998370c（Skills Manager 批量更新意外覆盖 125 个 SKILL.md 的 4 个必填 frontmatter
    #   字段）事件后，已用 tools/_fix-from-history.mjs + tools/_fix-remaining.mjs 修复全部
    #   169 个技能，validate-skills.mjs 退出码为 0。现恢复为硬门禁：任何 PR 若再次破坏
    #   frontmatter（缺 en_description / zh_displayName / category / en_category 或顺序错乱），
    #   CI 直接失败阻断合并，从源头防止上游工具/手动编辑覆盖契约字段。
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 skills/*/SKILL.md frontmatter
        id: validate
        run: |
          set +e
          node tools/validate-skills.mjs 2>&1 | tee validate.log
          code=${PIPESTATUS[0]}
          count=$(grep -c '^  - ' validate.log || true)
          {
            echo "### 技能元数据校验"
            echo ""
            if [ "$code" -eq 0 ]; then
              echo "✅ 全部技能 frontmatter 规范"
            else
              echo "⚠️ 发现 **${count}** 处 frontmatter 问题（已阻断合并）"
              echo ""
              echo "<details><summary>查看全部问题</summary>"
              echo ""
              echo '```'
              grep '^  - ' validate.log | head -50
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  build:
    name: 生产构建
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 复用 Next.js 构建缓存（.next/cache），显著缩短二次构建耗时
      - name: 恢复 Next.js 构建缓存
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: 生产构建
        # 执行 data/*.json 与 prototype/prototype.html 生成 + next build
        run: pnpm build

      - name: 校验生成物与仓库一致性（观察期·不阻断）
        # 观察期说明：
        #   当前构建不可复现——同一份代码重新构建会改写已入库的
        #   data/skills-data.json、data/skills-metrics.json、prototype/prototype.html，
        #   且技能数已从 README 的 223 漂移到 229。设为硬门禁会导致 CI 恒红。
        # TODO: 收敛为可复现构建后，删除 continue-on-error 改为硬门禁。
        id: sync
        continue-on-error: true
        run: |
          dirty=$(git status --porcelain -- data prototype app)
          if [ -n "$dirty" ]; then
            {
              echo "### 生成物一致性（观察期）"
              echo ""
              echo "⚠️ 构建产物与仓库内版本不一致，请本地执行 \`npm run build\` 后提交："
              echo ""
              echo '```'
              echo "$dirty"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git --no-pager diff --stat -- data prototype app
            exit 1
          fi
          echo "✅ 生成物与仓库一致" >> "$GITHUB_STEP_SUMMARY"

      # 只上传轻量交付物（data + 自包含原型页），
      # .next 体积较大，由 deploy.yml 在自己的 job 内重新构建，不跨 workflow 传递
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: skills-hub-build-${{ github.sha }}
          path: |
            data/skills-data.json
            data/skills-metrics.json
            prototype/prototype.html
          retention-days: 7
          if-no-files-found: error
