# CI/CD —— 单一串行流水线：校验 → 构建 → 测试 → 部署(EdgeOne) → 发布(GitHub Release)
#
# 触发：
#   push 到 main        → 校验 + 构建 + 测试 + 生产部署（不发布 Release）
#   push 标签 v*        → 同上 + 发布 GitHub Release（含构建产物与从 CHANGELOG 提取的说明）
#   pull_request        → 校验 + 构建 + 测试 + 预览部署（不发布）
#   workflow_dispatch   → 手动触发，可选 production / preview 环境
#
# 发布模式（标签触发，可追溯 / 可重复 / 风险低）：
#   你手动 bump 版本 + 更新 CHANGELOG → 打 vX.Y.Z 标签并推送 → 本流水线在末尾 Release 阶段
#   以 data/*.json 作为发布附件，并提取对应 CHANGELOG 小节作为发行说明。
#   校验阶段检查「package.json 版本 == 最新 CHANGELOG 小节 == git tag」一致性，不一致直接阻断。
#
# 设计要点：
#   1) 构建一次、多处复用：`build` job 产出 .next 并上传为构件，`deploy` 直接下载复用，
#      避免原先 build / e2e / deploy 各自重复执行 next build（由 3 次降为 1 次）。
#   2) 缓存：Bun 依赖缓存（~/.bun/install/cache）、Next.js 构建缓存（.next/cache）、
#      Playwright 浏览器缓存（~/.cache/ms-playwright）。
#   3) 并发分组：校验/构建/测试同组可取消；部署与发布独占不可取消组，避免新提交
#      打断进行中的部署导致半成品（原先所有 job 共用一个 cancel-in-progress:true 组）。
#   4) run 脚本一律通过 env 传值再引用 "$VAR"，不直接插值 ${{ }}，收敛命令注入面。
#   5) 每个 job 显式 timeout-minutes，避免外部命令/CLI 挂起长期占用 runner。
#
# 包管理器：Bun（BUN_VERSION 建议固定为具体版本以获得可复现构建；仓库暂无 bun.lock，
#           若希望完全可复现，请本地 `bun install` 提交 bun.lock）
# 部署平台：EdgeOne Pages
# 前置 Secret：EDGEONE_API_TOKEN（Settings → Secrets and variables → Actions）；缺省时跳过部署并提示。
#
# 部署产物目录：next.config.mjs 为 output:"export"（静态导出），站点静态产物落在 `out/`，
# 下方部署步骤上传并部署 `./out`（已修正此前误用 `.next` 的错位，见 tasks.md #2 / spec §8.1）。

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 部署环境
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  BUN_VERSION: "1.4.3"
  NEXT_TELEMETRY_DISABLED: "1"
  HAS_TOKEN: ${{ secrets.EDGEONE_API_TOKEN != '' }}

jobs:
  # ───────────────────────── 校验 ─────────────────────────
  validate:
    name: 校验（类型 + 单元/集成测试 + 版本一致性）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: 环境准备（Bun + Node + 依赖）
        uses: ./.github/actions/setup-env
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: 类型检查
        run: bun run lint

      - name: 单元测试 + 集成测试
        run: bun run test

      - name: 校验 SKILL.md frontmatter 契约（§2）
        run: node tools/validate-skills.mjs

      - name: 版本 / CHANGELOG / Tag 一致性校验
        run: node tools/check-version.mjs

  # ───────────────────────── 构建（全流程唯一一次） ─────────────────────────
  build:
    name: 生产构建
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate]
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 环境准备（Bun + Node + 依赖）
        uses: ./.github/actions/setup-env
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: 恢复 Next.js 构建缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package.json', 'bun.lock', 'src/**/*', 'data/**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: 生产构建
        run: bun run build

      - name: 上传部署构件（out/，供 deploy 复用）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: out-build-${{ github.sha }}
          path: out
          retention-days: 1
          if-no-files-found: error

  # ───────────────────────── E2E 冒烟 ─────────────────────────
  # 说明：应用本体由 express `server.js` 提供（src/index.html 静态站 + /api/votes、/api/favorites），
  # 见 playwright.config.ts 的 webServer.command（`bun run start`）。因此 e2e 无需重建，
  # 且 next.config.mjs 为 output:"export"，不可使用 next start。
  e2e:
    name: E2E 冒烟（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 环境准备（Bun + Node + 依赖）
        uses: ./.github/actions/setup-env
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: 恢复 Playwright 浏览器缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安装 Playwright 浏览器（chromium）
        run: bunx playwright install --with-deps chromium

      - name: E2E 测试
        run: bun run e2e

      - name: 上传 Playwright 报告（失败留存）
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  # ───────────────────────── 部署 ─────────────────────────
  deploy:
    name: 部署（EdgeOne Pages）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [e2e]
    permissions:
      contents: read
      pull-requests: write
    # 独占且不可取消：确保进行中的部署不被后续 push 打断，避免半成品部署。
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 安装 Node.js（供 edgeone CLI）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 下载构建构件（out）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: out-build-${{ github.sha }}
          path: out-artifact

      - name: 还原构建产物至 ./out
        run: |
          # output:"export" 产物落于 out/，统一还原为 ./out
          if [ -d out-artifact/out ]; then
            rm -rf out && mv out-artifact/out out
          else
            rm -rf out && mv out-artifact out
          fi
          test -d out && echo "✓ 已还原 out/"

      - name: 解析部署目标
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "env=${INPUT_ENV:-production}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "env=preview" >> "$GITHUB_OUTPUT"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi
          echo "name=${PROJECT_NAME:-agent-skills-hub}" >> "$GITHUB_OUTPUT"

      - name: 部署到 EdgeOne Pages
        id: deploy
        if: env.HAS_TOKEN == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          DEPLOY_NAME: ${{ steps.target.outputs.name }}
          DEPLOY_ENV: ${{ steps.target.outputs.env }}
        run: |
          set -o pipefail
          # 固定 edgeone CLI 版本以获得可复现部署（#10）；升级时同步更新下方版本号。
          npx --yes edgeone@1.6.45 pages deploy ./out \
            -n "$DEPLOY_NAME" \
            -t "$EDGEONE_API_TOKEN" \
            -e "$DEPLOY_ENV" 2>&1 | tee deploy.log
          url=$(grep -o 'EDGEONE_DEPLOY_URL=.*' deploy.log | head -1 | cut -d'=' -f2-)
          pid=$(grep -o 'EDGEONE_PROJECT_ID=.*' deploy.log | head -1 | cut -d'=' -f2-)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "project_id=${pid}" >> "$GITHUB_OUTPUT"
          {
            echo "### EdgeOne Pages 部署"
            echo ""
            echo "| 项目 | 环境 | 链接 |"
            echo "|---|---|---|"
            echo "| $DEPLOY_NAME | $DEPLOY_ENV | ${url:-（CLI 未返回链接）} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提示未配置部署密钥
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::未检测到 EDGEONE_API_TOKEN，已跳过部署。请在仓库 Settings → Secrets and variables → Actions 中配置。"
          {
            echo "### EdgeOne Pages 部署"
            echo ""
            echo "⚠️ 已跳过：未配置 \`EDGEONE_API_TOKEN\` secret。构建已通过，产物未上传。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 回写预览链接到 PR
        if: |
          env.HAS_TOKEN == 'true' &&
          github.event_name == 'pull_request' &&
          steps.deploy.outputs.url != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PROJECT_ID: ${{ steps.deploy.outputs.project_id }}
          DEPLOY_ENV: ${{ steps.target.outputs.env }}
          PROJECT_NAME: ${{ steps.target.outputs.name }}
        with:
          script: |
            const marker = '<!-- edgeone-preview -->';
            const time = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
            const body = [
              marker,
              '## 🚀 EdgeOne Pages 预览部署完成',
              '',
              '| 项目 | 环境 | 预览链接 | 项目 ID | 更新时间 |',
              '|---|---|---|---|---|',
              `| ${process.env.PROJECT_NAME} | ${process.env.DEPLOY_ENV} | [🔗 点击预览](${process.env.DEPLOY_URL}) | ${process.env.PROJECT_ID || '-'} | ${time} |`,
            ].join('\n');
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

  # ───────────────────────── 发布 GitHub Release ─────────────────────────
  release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: 安装 Node.js（固定版本，避免依赖 runner 自带 Node）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 解析版本号
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # data/*.json 由 git 跟踪且构建不重新生成，直接取本次检出的文件作为发布附件，无需构件往返。
      - name: 提取发行说明（CHANGELOG 对应小节）
        run: node tools/extract-release-notes.mjs "$VERSION" CHANGELOG.md release-notes.md
        env:
          VERSION: ${{ env.version }}

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ env.version }}
          body_path: release-notes.md
          files: |
            data/skills-data.json
            data/skills-metrics.json
