# CI/CD —— 单一串行流水线：校验 → 构建 → 测试 → 部署(EdgeOne) → 发布(GitHub Release)
#
# 触发：
#   push 到 main        → 校验 + 构建 + 测试 + 生产部署（不发布 Release）
#   push 标签 v*        → 同上 + 发布 GitHub Release（含构建产物与从 CHANGELOG 提取的说明）
#   pull_request        → 校验 + 构建 + 测试 + 预览部署（不发布）
#   workflow_dispatch   → 手动触发，可选 production / preview 环境
#
# 发布模式（标签触发，可追溯 / 可重复 / 风险低）：
#   你手动 bump 版本 + 更新 CHANGELOG → 打 vX.Y.Z 标签并推送 → 本流水线在末尾 Release 阶段
#   构建 data/*.json 与 prototype.html 作为产物附件，并提取对应 CHANGELOG 小节作为发行说明。
#   校验阶段检查「package.json 版本 == 最新 CHANGELOG 小节 == git tag」一致性，不一致直接阻断。
#
# 部署平台：EdgeOne Pages（Next.js standalone，消费 .next 目录）
# 前置 Secret：EDGEONE_API_TOKEN（Settings → Secrets and variables → Actions）；缺省时跳过部署并提示。

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 部署环境
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

# 校验 / 构建 / 测试阶段可取消进行中的运行；部署与发布单独分组，避免中断产生半成品。
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.24.0"
  NEXT_TELEMETRY_DISABLED: "1"
  HAS_TOKEN: ${{ secrets.EDGEONE_API_TOKEN != '' }}

jobs:
  validate:
    name: 校验（类型 + 单元/集成测试 + 版本一致性）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 单元测试 + 集成测试
        run: pnpm test

      - name: 版本 / CHANGELOG / Tag 一致性校验
        run: node tools/check-version.mjs

  build:
    name: 生产构建
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 恢复 Next.js 构建缓存
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: 生产构建
        run: pnpm build

      - name: 上传构建产物（数据 + 自包含原型页）
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: |
            data/skills-data.json
            data/skills-metrics.json
            prototype/prototype.html
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: E2E 冒烟（Playwright）
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Playwright 浏览器（chromium）
        run: pnpm exec playwright install --with-deps chromium

      - name: 生产构建（供 e2e 起服务）
        run: pnpm build

      - name: E2E 测试
        run: pnpm e2e

      - name: 上传 Playwright 报告（失败留存）
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  deploy:
    name: 部署（EdgeOne Pages）
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 恢复 Next.js 构建缓存
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: 生产构建
        run: pnpm build

      - name: 解析部署目标
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "env=preview" >> "$GITHUB_OUTPUT"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi
          echo "name=${{ vars.EDGEONE_PROJECT_NAME || 'agent-skills-hub' }}" >> "$GITHUB_OUTPUT"

      - name: 部署到 EdgeOne Pages
        id: deploy
        if: env.HAS_TOKEN == 'true'
        run: |
          set -o pipefail
          npx --yes edgeone@latest pages deploy ./.next \
            -n "${{ steps.target.outputs.name }}" \
            -t "$EDGEONE_API_TOKEN" \
            -e "${{ steps.target.outputs.env }}" 2>&1 | tee deploy.log
          url=$(grep -o 'EDGEONE_DEPLOY_URL=.*' deploy.log | head -1 | cut -d'=' -f2-)
          pid=$(grep -o 'EDGEONE_PROJECT_ID=.*' deploy.log | head -1 | cut -d'=' -f2-)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "project_id=${pid}" >> "$GITHUB_OUTPUT"
          {
            echo "### EdgeOne Pages 部署"
            echo ""
            echo "| 项目 | 环境 | 链接 |"
            echo "|---|---|---|"
            echo "| ${{ steps.target.outputs.name }} | ${{ steps.target.outputs.env }} | ${url:-（CLI 未返回链接）} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

      - name: 提示未配置部署密钥
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::未检测到 EDGEONE_API_TOKEN，已跳过部署。请在仓库 Settings → Secrets and variables → Actions 中配置。"
          {
            echo "### EdgeOne Pages 部署"
            echo ""
            echo "⚠️ 已跳过：未配置 \`EDGEONE_API_TOKEN\` secret。构建已通过，产物未上传。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 回写预览链接到 PR
        if: |
          env.HAS_TOKEN == 'true' &&
          github.event_name == 'pull_request' &&
          steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PROJECT_ID: ${{ steps.deploy.outputs.project_id }}
          DEPLOY_ENV: ${{ steps.target.outputs.env }}
          PROJECT_NAME: ${{ steps.target.outputs.name }}
        with:
          script: |
            const marker = '<!-- edgeone-preview -->';
            const time = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
            const body = [
              marker,
              '## 🚀 EdgeOne Pages 预览部署完成',
              '',
              '| 项目 | 环境 | 预览链接 | 项目 ID | 更新时间 |',
              '|---|---|---|---|---|',
              `| ${process.env.PROJECT_NAME} | ${process.env.DEPLOY_ENV} | [🔗 点击预览](${process.env.DEPLOY_URL}) | ${process.env.PROJECT_ID || '-'} | ${time} |`,
            ].join('\n');
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

  release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: .

      - name: 提取发行说明（CHANGELOG 对应小节）
        run: node tools/extract-release-notes.mjs ${{ env.version }} CHANGELOG.md release-notes.md

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ env.version }}
          body_path: release-notes.md
          files: |
            data/skills-data.json
            data/skills-metrics.json
            prototype/prototype.html
