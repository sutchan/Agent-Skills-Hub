name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate skills frontmatter & build data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate skills frontmatter (CI gate)
        run: node tools/validate-skills.mjs

      - name: Build skills data (smoke)
        run: node tools/build-skills-data.mjs

      - name: Run unit tests (tools/lib)
        run: node --test "tools/lib/*.test.mjs"
