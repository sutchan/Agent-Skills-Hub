name: Verify README

on:
  push:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'tools/**'
  pull_request:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'tools/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify README matches skills/
        run: python tools/skills_readme.py verify
