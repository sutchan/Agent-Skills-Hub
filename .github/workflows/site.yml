name: Site Build

on:
  push:
    paths:
      - 'site/**'
      - 'skills/**'
      - 'README.md'
      - 'tools/**'
  pull_request:
    paths:
      - 'site/**'
      - 'skills/**'
      - 'README.md'
      - 'tools/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: cd site && npm ci
      - name: Regenerate site data from README
        run: python site/build_site.py
      - name: Verify skills.json is up to date
        # 若 README 已更新但 skills.json 未重新生成，CI 在此拦截
        run: git diff --exit-code site/data/skills.json
      - name: Build site
        run: cd site && npm run build
