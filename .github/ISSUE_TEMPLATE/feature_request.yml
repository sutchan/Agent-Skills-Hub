name: Feature Request
description: 请求新功能、新技能或改进
title: "[feat] <期望的功能>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请说明动机与预期收益，帮助维护者评估优先级。
  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 问题
      description: 你希望解决什么问题，或弥补什么缺失
      placeholder: 目前无法…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望如何实现（功能行为、交互、展示等）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法（可选）
  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - 新技能
        - 展示页 / 原型
        - 构建 / 数据管线
        - app/ 应用
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 其他需要补充的信息（可选）
