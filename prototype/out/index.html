<!DOCTYPE html>
<!-- prototype/src/index.html v1.13.0 — Agent Skills Hub 高保真原型模板 -->
<html lang="zh" data-theme="light" data-lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Skills Hub · 原型</title>
  <style>/* prototype/src/styles/tokens.css v1.13.1 — 设计令牌 + reset（DESIGN.md §2） */
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --surface-2: #f1f3f5;
  --border: #e4e7ec;
  --text: #1a1d23;
  --text-2: #5b6472;
  --text-3: #8a93a3;
  --primary: #2e9e6b;
  --primary-weak: #e6f4ec;
  --primary-strong: #24815a;
  --danger: #e5484d;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow-card: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .04);
  --shadow-pop: 0 12px 32px rgba(16, 24, 40, .16), 0 4px 12px rgba(16, 24, 40, .08);
  --font-sans: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-en: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --maxw: 1200px;
}
html[data-theme="dark"] {
  --bg: #0d0f14;
  --surface: #161a22;
  --surface-2: #1e232d;
  --border: #2a313d;
  --text: #e7ebf1;
  --text-2: #a3adbd;
  --text-3: #6b7484;
  --primary: #5cc98c;
  --primary-weak: #14271e;
  --primary-strong: #7fe0a6;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-pop: 0 16px 40px rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
  transition: background .2s ease, color .2s ease;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

/* 仅供屏幕阅读器（sr-only）— 弹窗标题等无障碍语义（COMPONENTS #7） */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* prototype/src/app.css v1.13.1 — 组件与布局样式 (DESIGN.md)
   设计令牌与 reset 已拆分至 src/styles/tokens.css，由 build.mjs 顺序拼接。 */

/* ---------- 全局 UX 增强（无障碍 + 动效 + 长列表） ---------- */
/* 键盘焦点可见：仅对键盘用户显示焦点环，避免鼠标点击残留描边 */
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
/* 打开弹窗时锁定背景滚动 */
body.no-scroll { overflow: hidden; }
/* 尊重用户的减少动效偏好（无障碍 WCAG 2.3.3） */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
/* 回到顶部按钮：默认隐藏，滚动超阈值后淡入 */
.to-top {
  position: fixed; right: 20px; bottom: 20px; z-index: 40;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: grid; place-items: center;
  box-shadow: var(--shadow-pop);
  opacity: 0; visibility: hidden; transform: translateY(8px);
  transition: opacity .2s ease, transform .2s ease, visibility .2s;
}
.to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
.to-top:hover { background: var(--primary-strong); }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: var(--maxw); margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
  padding: 14px 24px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.brand .logo {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, var(--primary), #3fae7c);
  display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 800;
}
.brand small { display: block; font-size: 11px; font-weight: 500; color: var(--text-3); }
.topbar-spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center; color: var(--text-2);
  border: 1px solid transparent; transition: .15s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

/* ---------- Hero ---------- */
.hero { max-width: var(--maxw); margin: 0 auto; padding: 40px 24px 8px; }
.hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
.hero p { color: var(--text-2); margin-top: 8px; max-width: 640px; }
.stats { display: flex; gap: 28px; margin-top: 22px; flex-wrap: wrap; }
.stat .num { font-size: 24px; font-weight: 800; color: var(--primary); }
.stat .label { font-size: 13px; color: var(--text-3); }

/* ---------- 控制条 ---------- */
.controls {
  max-width: var(--maxw); margin: 20px auto 0; padding: 0 24px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.search {
  position: relative; flex: 1; min-width: 240px;
}
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.search input {
  width: 100%; height: 44px; padding: 0 14px 0 42px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); color: var(--text); font-size: 15px;
  outline: none; transition: .15s;
}
.search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-weak); }
.view-toggle { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.view-toggle button { padding: 9px 12px; border-radius: 8px; color: var(--text-2); display: grid; place-items: center; }
.view-toggle button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-card); }

/* ---------- 分类条 ---------- */
.cats { max-width: var(--maxw); margin: 18px auto 0; padding: 0 24px; position: relative; }
/* 右侧渐隐遮罩：提示分类可横向滚动，溢出时可见（纯装饰，不挡交互） */
.cats::after {
  content: ""; position: absolute; top: 0; right: 0; bottom: 4px; width: 40px;
  background: linear-gradient(to right, transparent, var(--bg));
  pointer-events: none; opacity: 0; transition: opacity .2s ease;
}
.cats.overflow::after { opacity: 1; }
.cats-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cats-scroll::-webkit-scrollbar { display: none; }
.chip {
  white-space: nowrap; padding: 8px 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-2); font-size: 13px; font-weight: 500; transition: .15s;
}
.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip .c { opacity: .7; margin-left: 6px; font-size: 12px; }

/* ---------- 网格 / 列表 ---------- */
.grid {
  max-width: var(--maxw); margin: 22px auto 64px; padding: 0 24px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
}
.grid.list { grid-template-columns: 1fr; gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow-card); cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  display: flex; flex-direction: column; gap: 8px;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-pop); border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); }
.card .avatar {
  width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
  display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff;
  background: linear-gradient(135deg, var(--primary), #3fae7c);
}
.grid.list .card { flex-direction: row; align-items: center; gap: 14px; padding: 14px 18px; }
.grid.list .card .body { flex: 1; }
.card .name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card .badge {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  background: var(--primary-weak); color: var(--primary-strong);
}
.card .desc { color: var(--text-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.grid.list .card .desc { -webkit-line-clamp: 1; }
.card .meta { display: flex; gap: 8px; align-items: center; color: var(--text-3); font-size: 12px; }
.card .cat-tag { font-size: 11px; color: var(--text-3); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; }

.empty { text-align: center; color: var(--text-3); padding: 60px 20px; }

/* ---------- 详情弹窗 ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(16, 24, 40, .5);
  backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; padding: 24px;
}
.overlay.open { display: flex; }
.dialog {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  width: min(560px, 100%); max-height: 86vh; overflow: auto; box-shadow: var(--shadow-pop);
  animation: pop .18s ease;
}
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.dialog-head { display: flex; gap: 14px; padding: 24px 24px 0; }
.dialog-head .avatar { width: 52px; height: 52px; font-size: 20px; border-radius: 14px; }
.dialog-head h2 { font-size: 20px; font-weight: 800; }
.dialog-head .sub { color: var(--text-3); font-size: 13px; font-family: var(--font-en); word-break: break-all; }
.dialog-close { margin-left: auto; }
.dialog-body { padding: 18px 24px 24px; }
.dialog-body .block { margin-bottom: 18px; }
.dialog-body .block h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); margin-bottom: 6px; }
.dialog-body .block p { font-size: 14.5px; color: var(--text); }
.dialog-body .tools { display: flex; flex-wrap: wrap; gap: 6px; }
.dialog-body .tool { font-family: var(--font-en); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); padding: 4px 10px; border-radius: 8px; color: var(--text-2); }
.dialog-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
.btn {
  flex: 1; height: 42px; border-radius: 11px; font-weight: 600; font-size: 14px;
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: .15s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-strong); }
.btn-ghost { background: var(--surface-2); color: var(--text-2); flex: 0 0 auto; padding: 0 16px; }
.btn-ghost:hover { color: var(--text); }

/* ---------- 移动端 Sheet ---------- */
@media (max-width: 640px) {
  .overlay { padding: 0; align-items: flex-end; }
  .dialog { width: 100%; max-height: 92vh; border-radius: 20px 20px 0 0; animation: sheet .22s ease; }
  @keyframes sheet { from { transform: translateY(100%); } to { transform: none; } }
  .hero h1 { font-size: 24px; }
  .topbar-inner { padding: 12px 16px; }
  .hero, .controls, .cats, .grid { padding-left: 16px; padding-right: 16px; }
  .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid.list { grid-template-columns: 1fr; }
  .card .desc { display: none; }
  .grid.list .card .desc { display: -webkit-box; }
}

/* ---------- 卡片键盘焦点环（无障碍） ---------- */
.card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---------- 空状态（DESIGN §4.4） ---------- */
.empty-state {
  grid-column: 1 / -1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 6px; padding: 64px 24px; color: var(--text-2);
}
.empty-state svg { color: var(--text-3); margin-bottom: 8px; }
.empty-state .empty-title { font-size: 17px; font-weight: 700; color: var(--text); }
.empty-state .empty-desc { font-size: 13.5px; max-width: 320px; }
.empty-state #clearFilters { margin-top: 10px; }


/* 语言切换后英文描述 */
html[data-lang="en"] .zh { display: none; }
html[data-lang="zh"] .en { display: none; }
</style>
</head>

  <header class="topbar" id="siteHeader">

  var FALLBACK = "zh";

      // 同步失败不应影响交互逻辑
    }
  }

  var api = {
    translations: translations,
    supported: SUPPORTED,
    fallback: FALLBACK,
    t: t,

    setLang: setLang,

  renderStats(filtered);
  grid.className = "grid" + (state.view === "list" ? " list" : "");
  grid.innerHTML = filtered.length ? filtered.map(cardHTML).join("") : emptyHTML();
}

// ---------- 详情弹窗 ----------
let lastFocused = null; // 记录打开弹窗前的焦点元素，关闭后归还
function openDetail(name) {
  const s = SKILLS_DATA.skills.find((x) => x.name === name);
  if (!s) return;
  lastFocused = document.activeElement;
  const tools = (s.allowedTools || "")
    .split(",")
    .map((t) => t.trim())
    .filter(Boolean)
    .map((t) => `<span class="tool">${esc(t)}</span>`)
    .join("");
  $("#dialog").innerHTML = `
    <div class="sr-only" id="dialogTitle">${esc(s.zh || s.name)}</div>
    <div class="dialog-head" id="dialogHead">
      <div class="avatar">${initials(s.name)}</div>
      <div>
        <h2 id="dialogVisibleTitle">${esc(s.zh || s.name)}</h2>
        <div class="sub en">${esc(s.name)}</div>
      </div>
      <button class="icon-btn dialog-close" id="closeBtn" aria-label="${I18N.t("detail.close")}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="dialog-body" id="dialogBody">
      <div class="block" id="dialogBlockZh"><h3 class="zh">${I18N.t("detail.zhTitle", "zh")}</h3><h3 class="en">${I18N.t("detail.zhTitle", "en")}</h3><p class="zh">${esc(s.zh)}</p></div>
      <div class="block" id="dialogBlockEn"><h3 class="zh">${I18N.t("detail.enTitle", "zh")}</h3><h3 class="en">${I18N.t("detail.enTitle", "en")}</h3><p class="en">${esc(s.description)}</p></div>
      <div class="block" id="dialogBlockCat"><h3>${I18N.t("detail.catTitle")}</h3><p>${esc(s.category)}</p></div>
      ${tools ? `<div class="block" id="dialogBlockTools"><h3>${I18N.t("detail.toolsTitle")}</h3><div class="tools">${tools}</div></div>` : ""}
    </div>
    <div class="dialog-foot" id="dialogFoot">
      <button class="btn btn-ghost" id="closeBtn2">${I18N.t("detail.close")}</button>
      <a class="btn btn-primary" href="skills/${esc(s.name)}/" target="_blank" rel="noopener">
        <span class="zh">${I18N.t("detail.open", "zh")}</span><span class="en">${I18N.t("detail.openEn", "en")}</span>
      </a>
    </div>`;
  overlay.classList.add("open");
  document.body.classList.add("no-scroll"); // 打开弹窗时锁定背景滚动
  const cb = $("#closeBtn"); if (cb) cb.onclick = closeDetail;
  const cb2 = $("#closeBtn2"); if (cb2) cb2.onclick = closeDetail;
  if (cb) cb.focus(); // 焦点移入弹窗首个可聚焦元素，满足键盘用户可达
}
function closeDetail() {
  if (!overlay.classList.contains("open")) return;
  overlay.classList.remove("open");
  document.body.classList.remove("no-scroll");
  // 焦点归还到打开前的元素，避免键盘焦点丢失
  if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
  lastFocused = null;
}
// 焦点陷阱：Tab 在弹窗内循环，不逃逸到背景（无障碍）
function trapFocus(e) {
  if (!overlay.classList.contains("open") || e.key !== "Tab") return;
  const f = overlay.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

// ---------- 主题 / 语言 ----------
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  const sun = state.theme === "dark";
  $("#themeIcon").innerHTML = sun
    ? '<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"></path>'
    : '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>';
}
function applyLang() {
  // 语言状态与 DOM 同步统一交给 I18N 模块，保证文案随语言联动且不崩溃
  I18N.setLang(state.lang); // 以持久化/默认语言为准初始化
  // 输入框占位符为单节点，无法用 CSS 显隐，故由 i18n 直接驱动
  const si = $("#searchInput");
  if (si) si.placeholder = I18N.t("search.placeholder");
}

// ---------- 事件绑定 ----------
function bind() {
  // 轻量防抖，避免每次按键全量重渲染（性能）
  let t;
  $("#searchInput").addEventListener("input", (e) => {
    clearTimeout(t);
    const v = e.target.value;
    t = setTimeout(() => { state.q = v; renderGrid(); }, 120);
  });
  $("#viewToggle").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.view = b.dataset.view;
    $("#viewToggle").querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
    renderGrid();
  });
  $("#cats").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    state.cat = b.dataset.cat; renderCats(); renderGrid();
  });
  // 卡片点击（鼠标）与键盘（Enter/Space）统一打开详情
  grid.addEventListener("click", (e) => {
    const c = e.target.closest(".card"); if (c) openDetail(c.dataset.name);
  });
  grid.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const c = e.target.closest(".card"); if (!c) return;
    e.preventDefault();
    openDetail(c.dataset.name);
  });
  // 空状态清除筛选按钮
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) { closeDetail(); return; }
    if (e.target.closest("#clearFilters")) {
      state.q = ""; state.cat = "全部";
      const si = $("#searchInput"); if (si) si.value = "";
      renderCats(); renderGrid();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDetail();
    trapFocus(e); // 弹窗内焦点陷阱
  });
  $("#themeBtn").addEventListener("click", () => {
    state.theme = state.theme === "light" ? "dark" : "light";
    applyTheme(); savePref(LS_THEME, state.theme); // 持久化主题偏好
  });
  $("#langBtn").addEventListener("click", () => {
    I18N.toggleLang();
    state.lang = I18N.getLang();
    savePref(LS_LANG, state.lang); // 持久化语言偏好
  });
  // 回到顶部按钮：长列表滚动后出现，点击平滑回到顶部
  const toTop = $("#toTop");
  if (toTop) {
    window.addEventListener("scroll", () => {
      toTop.classList.toggle("show", window.scrollY > 600);
    }, { passive: true });
    toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  }
  // 分类条溢出指示：内容超出可视宽度时显示右侧渐隐遮罩
  const catsNav = $("#categoryNav");
  const catsScroll = $("#cats");
  function updateCatsOverflow() {
    if (!catsNav || !catsScroll) return;
    catsNav.classList.toggle("overflow", catsScroll.scrollWidth - catsScroll.clientWidth > 4);
  }
  catsScroll && catsScroll.addEventListener("scroll", updateCatsOverflow, { passive: true });
  window.addEventListener("resize", updateCatsOverflow, { passive: true });
  // 初次渲染后下一帧检测（DOM 已布局）
  requestAnimationFrame(updateCatsOverflow);
}

// ---------- 启动 ----------
function init() {
  applyTheme(); applyLang(); renderCats(); renderGrid(); bind();
}
init();
</script>
</body>
</html>
