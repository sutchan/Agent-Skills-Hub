<!DOCTYPE html>
<!-- prototype/src/index.html v1.13.0 — Agent Skills Hub 高保真原型模板 -->
<html lang="zh" data-theme="light" data-lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Skills Hub · 原型</title>
  <style>{{CSS}}</style>
</head>
<body>
  <header class="topbar" id="siteHeader">
    <div class="topbar-inner" id="topbarInner">
      <a class="brand" id="brandLink" href="#">
        <span class="logo">S</span>
        <span>Skills Hub<small data-i18n="brand.subtitle">Agent Skills Hub 原型</small></span>
      </a>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" id="langBtn" title="语言 / Language" aria-label="切换语言 / Switch language" data-i18n="lang.toggle">中 / EN</button>
      <button class="icon-btn" id="themeBtn" title="主题 / Theme" aria-label="切换主题 / Switch theme" data-i18n="theme.toggle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </div>
  </header>

  <section class="hero" id="hero">
    <h1 class="zh" id="heroTitleZh" data-i18n="hero.title">发现并复用 200+ 高质量 Agent 技能</h1>
    <h1 class="en" id="heroTitleEn" data-i18n="hero.title">Discover & reuse 200+ high-quality agent skills</h1>
    <p class="zh" id="heroSubtitleZh" data-i18n="hero.subtitle">按分类浏览、搜索，或查看技能详情——为你的编码 agent 即取即用。</p>
    <p class="en" id="heroSubtitleEn" data-i18n="hero.subtitle">Browse by category, search, or inspect skill details — ready to drop into your coding agent.</p>
    <div class="stats" id="heroStats" aria-live="polite">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="label zh" data-i18n="stat.total">技能总数</div><div class="label en" data-i18n="stat.total">Total skills</div></div>
      <div class="stat"><div class="num" id="statCats">0</div><div class="label zh" data-i18n="stat.cats">分类</div><div class="label en" data-i18n="stat.cats">Categories</div></div>
      <div class="stat"><div class="num" id="statShown">0</div><div class="label zh" data-i18n="stat.shown">当前展示</div><div class="label en" data-i18n="stat.shown">Shown</div></div>
    </div>
  </section>

  <div class="controls" id="searchControls">
    <div class="search" id="searchBox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input id="searchInput" type="search" aria-label="搜索技能 / Search skills" placeholder="搜索技能名称或描述…" />
    </div>
    <div class="view-toggle" id="viewToggle">
      <button data-view="grid" class="active" title="网格">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
      </button>
      <button data-view="list" title="列表">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
      </button>
    </div>
  </div>

  <nav class="cats" id="categoryNav" aria-label="技能分类 / Categories"><div class="cats-scroll" id="cats"></div></nav>

  <main class="grid" id="grid" aria-label="技能列表" aria-live="polite"></main>

  <div class="overlay" id="overlay">
    <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></div>
  </div>

  <!-- 回到顶部按钮：长列表滚动后出现，提升长页面导航效率（id 供脚本精确选取） -->
  <button class="to-top" id="toTop" aria-label="回到顶部 / Back to top" title="回到顶部 / Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
  </button>

  <script>const SKILLS_DATA = {{DATA}};</script>
  <script>{{I18N}}</script>
  <script>{{JS}}</script>
</body>
</html>
