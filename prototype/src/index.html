<!DOCTYPE html>
<!-- prototype/src/index.html v1.0.0 — Agent Skills Hub 高保真原型模板 -->
<html lang="zh" data-theme="light" data-lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Skills Hub · 原型</title>
  <style>{{CSS}}</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#">
        <span class="logo">S</span>
        <span>Skills Hub<small>Agent Skills Hub 原型</small></span>
      </a>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" id="langBtn" title="语言 / Language">中 / EN</button>
      <button class="icon-btn" id="themeBtn" title="主题 / Theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <h1 class="zh">发现并复用 200+ 高质量 Agent 技能</h1>
    <h1 class="en">Discover & reuse 200+ high-quality agent skills</h1>
    <p class="zh">按分类浏览、搜索，或查看技能详情——为你的编码 agent 即取即用。</p>
    <p class="en">Browse by category, search, or inspect skill details — ready to drop into your coding agent.</p>
    <div class="stats">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="label zh">技能总数</div><div class="label en">Total skills</div></div>
      <div class="stat"><div class="num" id="statCats">0</div><div class="label zh">分类</div><div class="label en">Categories</div></div>
      <div class="stat"><div class="num" id="statShown">0</div><div class="label zh">当前展示</div><div class="label en">Shown</div></div>
    </div>
  </section>

  <div class="controls">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input id="searchInput" type="text" placeholder="搜索技能名称或描述…" />
    </div>
    <div class="view-toggle" id="viewToggle">
      <button data-view="grid" class="active" title="网格">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
      </button>
      <button data-view="list" title="列表">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
      </button>
    </div>
  </div>

  <nav class="cats"><div class="cats-scroll" id="cats"></div></nav>

  <main class="grid" id="grid"></main>

  <div class="overlay" id="overlay">
    <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <script>const SKILLS_DATA = {{DATA}};</script>
  <script>{{JS}}</script>
</body>
</html>
