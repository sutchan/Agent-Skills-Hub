version: 2
updates:
  # Web 应用（app/）的 npm 依赖
  # 注：prototype/ 为预构建静态原型，无 package.json，不纳入 npm 自动升级
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "app"

  # 根目录 GitHub Actions 工作流所用 Action 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
