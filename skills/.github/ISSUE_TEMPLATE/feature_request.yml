name: 功能建议（Feature Request）
description: 建议新增技能、改进现有技能或增强工具/文档
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: type
    attributes:
      label: 建议类型
      options:
        - 新增技能
        - 改进现有技能
        - 工具/脚本增强（tools/）
        - 文档/展示页改进
        - 其他
    validations:
      required: true
  - type: input
    id: skill_name
    attributes:
      label: 技能名称（如适用）
      description: 若涉及技能，填写目录名，如 python-testing
  - type: textarea
    id: problem
    attributes:
      label: 相关痛点
      description: 这个建议解决了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何实现？
  - type: textarea
    id: context
    attributes:
      label: 附加信息
